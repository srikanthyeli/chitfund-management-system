name: Deploy Hybrid (ECR -> EC2)

on:
  push:
    branches:
      - main # It's best practice to only auto-deploy pushes to the main branch to production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Generate Timestamp for Tag
      id: tag-timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Build, tag, and push BACKEND image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}-${{ steps.tag-timestamp.outputs.timestamp }}
      run: |
        cd backend/fastapi-app
        docker build -t $ECR_REGISTRY/chitfund-backend:$IMAGE_TAG .
        docker push $ECR_REGISTRY/chitfund-backend:$IMAGE_TAG

    - name: Build, tag, and push FRONTEND image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}-${{ steps.tag-timestamp.outputs.timestamp }}
      run: |
        cd frontend
        # Target 'runtime' builds the production assets
        docker build --target runtime -t $ECR_REGISTRY/chitfund-frontend:$IMAGE_TAG .
        docker push $ECR_REGISTRY/chitfund-frontend:$IMAGE_TAG

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}-${{ steps.tag-timestamp.outputs.timestamp }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY, IMAGE_TAG, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
        script: |
          # 1. Go to the project directory & pull the latest docker-compose.prod.yml
          cd chitfund-management-system
          git pull origin main
          
          # 2. Authenticate the EC2 Docker Daemon with AWS ECR
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 3. Pull the new images and restart the containers
          export ECR_REGISTRY=$ECR_REGISTRY
          export IMAGE_TAG=$IMAGE_TAG
          docker compose -f docker-compose.prod.yml up -d
