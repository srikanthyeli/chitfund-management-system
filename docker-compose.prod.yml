# ─────────────────────────────────────────────────────────────
#  ChitMate – Production Docker Compose (EC2)
#  Services: backend (FastAPI) → frontend (Nginx/React)
#  Note: Database is managed externally via AWS RDS
# ─────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/chitfund-backend:${IMAGE_TAG:-latest}
    container_name: chitfund-backend
    restart: always
    # We expose port 8000 internally so Nginx can route to it. 
    # Exposing it publicly is optional, but helpful for debugging.
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

    environment:
      ENVIRONMENT: dev

  # ── React / Vite Frontend (served via Nginx) ─────────────────
  frontend:
    image: ${ECR_REGISTRY}/chitfund-frontend:${IMAGE_TAG:-latest}
    container_name: chitfund-frontend
    restart: always
    ports:
      - "80:80"              # Access the app at http://<EC2-Public-IP>
    depends_on:
      - backend
